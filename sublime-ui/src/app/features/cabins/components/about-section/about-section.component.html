<section id="nosotros" class="bg-slate-50 py-20 sm:py-24">
  <app-container>

    <div class="grid items-center gap-12 lg:grid-cols-2 lg:gap-16">

      <div class="overflow-hidden rounded-3xl">
        <img [src]="image" [alt]="title" class="h-full min-h-[420px] w-full object-cover" />
      </div>

      <div>

        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-600">
          {{ eyebrow }}
        </p>

        <h2 class="mt-3 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
          {{ title }}
        </h2>

        <p class="mt-6 text-base leading-7 text-slate-600 sm:text-lg">
          {{ description }}
        </p>

        <ul class="mt-8 space-y-4">

          @for (highlight of highlights; track highlight) {
          <li class="flex items-start gap-3">

            <span
              class="mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-bold text-blue-700"
              aria-hidden="true">
              ✓
            </span>

            <span class="text-slate-700">
              {{ highlight }}
            </span>

          </li>
          }

        </ul>

      </div>

    </div>

  </app-container>
</section>
