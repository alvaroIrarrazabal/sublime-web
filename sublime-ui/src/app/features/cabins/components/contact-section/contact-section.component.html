<section id="contacto" class="bg-slate-950 py-20 text-white sm:py-24">

  <app-container>

    <div class="grid gap-12 lg:grid-cols-2 lg:items-stretch">

      <!-- Información -->
      <div class="flex flex-col justify-center">

        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-primary-soft">
          Contacto
        </p>

        <h2 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">
          ¿Listo para disfrutar Pucón?
        </h2>

        <p class="mt-5 max-w-xl text-base leading-7 text-slate-300">
          Escríbenos para consultar disponibilidad, tarifas o resolver cualquier
          duda sobre tu estadía.
        </p>

        <div class="mt-8 space-y-5">

          <div>
            <p class="text-sm font-semibold text-slate-400">
              Dirección
            </p>
            <p class="mt-1 text-white">
              {{ address }}
            </p>
          </div>

          <div>
            <p class="text-sm font-semibold text-slate-400">
              Teléfono
            </p>
            <a [href]="'tel:' + phone" class="mt-1 inline-block text-white transition hover:text-primary-soft">
              {{ phone }}
            </a>
          </div>

          <div>
            <p class="text-sm font-semibold text-slate-400">
              Correo
            </p>
            <a [href]="'mailto:' + email" class="mt-1 inline-block text-white transition hover:text-primary-soft">
              {{ email }}
            </a>
          </div>

        </div>

        <div class="mt-8">
          <app-button
           [href]="whatsappUrl"
            rel="noopener noreferrer"
            target="_blank"
            size="lg">
            Consultar por WhatsApp
          </app-button>
        </div>

      </div>

      <!-- Mapa -->
      <div class="overflow-hidden rounded-3xl bg-slate-800">

        <iframe [src]="safeMapUrl" title="Ubicación de Bosque Andino" 
          class="min-h-[420px] w-full border-0"
          loading="lazy"
           referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

      </div>

    </div>

  </app-container>

</section>
