<section id="galeria" class="bg-white py-20 sm:py-24">
  <app-container>

    <div class="mx-auto mb-12 max-w-2xl text-center">

      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-600">
        Galería
      </p>

      <h2 class="mt-3 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
        Conoce Bosque Andino
      </h2>

      <p class="mt-4 text-base leading-7 text-slate-600">
        Descubre nuestros espacios, paisajes y rincones pensados para descansar.
      </p>

    </div>

    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-4">

      @for (image of images; track image.src + image.alt; let i = $index) {

      <figure class="group overflow-hidden rounded-2xl" [ngClass]="{
            'md:col-span-2 md:row-span-2': i === 0
          }">
        <img [src]="image.src" [alt]="image.alt"
          class="h-full min-h-64 w-full object-cover transition duration-500 group-hover:scale-105" />
      </figure>

      }

    </div>

  </app-container>
</section>
