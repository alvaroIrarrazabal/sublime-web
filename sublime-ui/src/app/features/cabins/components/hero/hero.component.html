<section id="inicio" class="relative isolate min-h-[620px] overflow-hidden bg-slate-950">
  <img [src]="backgroundImage" [alt]="title" class="absolute inset-0 -z-20 h-full w-full object-cover" />

  <div class="absolute inset-0 -z-10 bg-slate-950/60"></div>

  <app-container>
    <div class="flex min-h-[620px] max-w-3xl flex-col justify-center py-20 text-white">

      <p class="mb-4 text-sm font-semibold uppercase tracking-[0.25em] text-white/80">
        {{ eyebrow }}
      </p>

      <h1 class="text-4xl font-bold leading-tight sm:text-5xl lg:text-6xl">
        {{ title }}
      </h1>

      <p class="mt-6 max-w-2xl text-base leading-7 text-white/85 sm:text-lg">
        {{ description }}
      </p>

      <div class="mt-8 flex flex-wrap gap-4">
        <app-button [href]="primaryHref" size="lg">
          {{ primaryLabel }}
        </app-button>

        <app-button [href]="secondaryHref" variant="outline" size="lg">
          {{ secondaryLabel }}
        </app-button>
      </div>

    </div>
  </app-container>
</section>
