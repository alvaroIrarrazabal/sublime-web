<section id="servicios" class="bg-slate-50 py-20 sm:py-24">
  <app-container>

    <div class="mx-auto mb-12 max-w-2xl text-center">

      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-primary">
        Servicios
      </p>

      <h2 class="mt-3 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
        Todo lo que necesitas para disfrutar tu estadía
      </h2>

      <p class="mt-4 text-base leading-7 text-slate-600">
        Comodidades pensadas para que descanses y disfrutes Pucón sin preocupaciones.
      </p>

    </div>

    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">

      @for (service of services; track service.name) {

      <article
        class="rounded-2xl border border-slate-200 bg-white p-6 transition duration-200 hover:-translate-y-1 hover:shadow-lg">

        <app-icon
          [name]="service.icon"
          [size]="30"
          ></app-icon>

       

        <h3 class="text-lg font-semibold text-slate-900">
          {{ service.name }}
        </h3>

        <p class="mt-2 leading-6 text-slate-600">
          {{ service.description }}
        </p>

      </article>

      }

    </div>

  </app-container>
</section>
