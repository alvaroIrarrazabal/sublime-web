<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

    <div class="flex h-16 items-center justify-between">

      <!-- Marca -->
      <a
        href="#inicio"
        class="text-xl font-bold tracking-tight text-slate-900"
        (click)="closeMenu()">
        {{ brand }}
      </a>

      <!-- Navegación desktop -->
      <nav class="hidden items-center gap-8 md:flex">
        @for (item of items; track item.href) {
          <a
            [href]="item.href"
            class="text-sm font-medium text-slate-600 transition hover:text-slate-900">
            {{ item.label }}
          </a>
        }
      </nav>

      <!-- CTA desktop -->
      <div class="hidden md:block">
        <app-button
          [href]="ctaUrl"
          size="sm">
          {{ ctaLabel }}
        </app-button>
      </div>

      <!-- Botón menú mobile -->
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 text-slate-700 transition hover:bg-slate-50 md:hidden"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Abrir menú"
        (click)="toggleMenu()">

        @if (isMenuOpen) {
          <!-- X -->
          <span class="text-2xl leading-none">
            ×
          </span>
        } @else {
          <!-- Hamburguesa -->
          <span class="text-2xl leading-none">
            ☰
          </span>
        }

      </button>

    </div>

    <!-- Menú mobile -->
    @if (isMenuOpen) {

      <div class="border-t border-slate-100 py-4 md:hidden">

        <nav class="flex flex-col">

          @for (item of items; track item.href) {
            <a
              [href]="item.href"
              class="rounded-lg px-3 py-3 text-base font-medium text-slate-700 transition hover:bg-slate-50"
              (click)="closeMenu()">
              {{ item.label }}
            </a>
          }

        </nav>

        <div class="mt-4">
          <app-button
            [href]="ctaUrl"
            size="md">
            {{ ctaLabel }}
          </app-button>
        </div>

      </div>

    }

  </div>
</header>
