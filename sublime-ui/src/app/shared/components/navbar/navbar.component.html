<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">


    <a href="#inicio" class="text-xl font-bold tracking-tight text-slate-900">
      {{ brand }}
    </a>

    <nav class="hidden items-center gap-8 md:flex">
      @for (item of items; track item.href) {
      <a [href]="item.href" class="text-sm font-medium text-slate-600 transition hover:text-slate-900">
        {{ item.label }}
      </a>
      }
    </nav>

    <app-button [href]="ctaUrl"
     size="sm">
      {{ ctaLabel }}
    </app-button>

  </div>
</header>
