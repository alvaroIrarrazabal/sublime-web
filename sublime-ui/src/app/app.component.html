<app-navbar
  [brandName]="site.brand.name"
  [logoUrl]="site.brand.logoUrl ?? ''"
  [logoAlt]="site.brand.logoAlt ?? site.brand.name"
  ctaLabel="Reserva Ahora"
  [ctaUrl]="site.contact.whatsappUrl"
>
</app-navbar>

<app-cabins-hero
  [eyebrow]="site.hero.eyebrow"
  [title]="site.hero.title"
  [description]="site.hero.description"
  [backgroundImage]="site.hero.backgroundImage"
  [primaryLabel]="site.hero.primaryLabel"
  [primaryHref]="site.hero.primaryHref"
  [secondaryLabel]="site.hero.secondaryLabel"
  [secondaryHref]="site.hero.secondaryHref"
>
</app-cabins-hero>

<app-cabins-section 
[cabins]="config.cabins">
</app-cabins-section>

<app-services-section
 [services]="config.services">
</app-services-section>

<app-gallery-section 
[images]="config.gallery">
</app-gallery-section>

<app-about-section
  [eyebrow]="site.about.eyebrow"
  [title]="site.about.title"
  [description]="site.about.description"
  [image]="site.about.image"
  [highlights]="site.about.highlights"
>
</app-about-section>

<app-contact-section
  [address]="site.contact.address"
  [phone]="site.contact.phone"
  [email]="site.contact.email"
  [whatsappUrl]="site.contact.whatsappUrl"
  [mapUrl]="site.contact.mapUrl"
>
</app-contact-section>

<app-footer
  [description]="site.footer.description"
  [phone]="site.contact.phone"
  [email]="site.contact.email"
  [whatsappUrl]="site.contact.whatsappUrl"
[instagramUrl]="site.social.instagramUrl ?? ''"
[facebookUrl]="site.social.facebookUrl ?? ''"
>
</app-footer>
