<div class="min-h-screen bg-slate-100 p-10">

  <div class="mx-auto max-w-4xl">

    <h1 class="mb-8 text-3xl font-bold text-slate-900">
      Sublime Web — Button System
    </h1>

    <div class="rounded-2xl bg-white p-8 shadow-lg">

      <h2 class="mb-6 text-xl font-semibold">
        Variants
      </h2>

      <div class="flex flex-wrap gap-4">

        <app-button>
          Primary
        </app-button>

        <app-button variant="secondary">
          Secondary
        </app-button>

        <app-button variant="outline">
          Outline
        </app-button>

        <app-button variant="danger">
          Danger
        </app-button>

      </div>

      <h2 class="mb-6 mt-10 text-xl font-semibold">
        Sizes
      </h2>

      <div class="flex flex-wrap items-center gap-4">

        <app-button size="sm">
          Small
        </app-button>

        <app-button size="md">
          Medium
        </app-button>

        <app-button size="lg">
          Large
        </app-button>

      </div>

      <h2 class="mb-6 mt-10 text-xl font-semibold">
        States
      </h2>

      <div class="flex flex-wrap gap-4">

        <app-button>
          Active
        </app-button>

        <app-button [disabled]="true">
          Disabled
        </app-button>

      </div>

    </div>

  </div>

</div>
